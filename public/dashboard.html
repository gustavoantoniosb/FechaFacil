<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FechaFácil — Início</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="top-nav">
  <a href="/dashboard.html" class="logo">Fecha<span>Fácil</span></a>
  <button class="nav-action" onclick="window.location.href='/profile.html'">⚙️</button>
</nav>

<div class="content" id="content">
  <div style="text-align:center;padding:60px 0"><span class="spinner" style="border-color:rgba(27,58,107,.3);border-top-color:var(--blue);width:32px;height:32px;border-width:3px;"></span></div>
</div>

<nav class="bottom-nav">
  <a href="/dashboard.html" class="active">
    <span class="icon">🏠</span>Início
  </a>
  <a href="/quotes.html">
    <span class="icon">📋</span>Orçamentos
  </a>
  <a href="/clients.html">
    <span class="icon">👥</span>Clientes
  </a>
  <a href="/profile.html">
    <span class="icon">👤</span>Perfil
  </a>
</nav>

<button class="btn-icon" onclick="window.location.href='/quote-new.html'" title="Novo orçamento">+</button>

<div id="toast"></div>
<script src="/js/api.js"></script>
<script>
if (!requireAuth()) throw 0;

async function load() {
  const [dash, user] = await Promise.all([API.dashboard(), API.me()]);
  const greeting = ['Bom dia', 'Boa tarde', 'Boa noite'][Math.floor(new Date().getHours() / 8)] || 'Olá';
  const firstName = user.name.split(' ')[0];

  document.getElementById('content').innerHTML = `
    <div style="margin-bottom:18px">
      <h1 style="font-size:1.2rem">${greeting}, ${firstName}! 👋</h1>
      <p class="text-small">${new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'})}</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card highlight">
        <div class="stat-label">Faturamento do mês</div>
        <div class="stat-value">${formatMoney(dash.month_revenue)}</div>
        <div class="stat-sub">${dash.month_approved} orçamento(s) fechado(s)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Taxa de fechamento</div>
        <div class="stat-value">${dash.conversion}%</div>
        <div class="stat-sub">${dash.month_quotes} orçamento(s) enviado(s)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aguardando resposta</div>
        <div class="stat-value">${dash.pending_quotes}</div>
        <div class="stat-sub">orçamento(s) pendente(s)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total de clientes</div>
        <div class="stat-value">${dash.total_clients}</div>
        <div class="stat-sub">cadastrados</div>
      </div>
    </div>

    <div class="section-header">
      <h2>Orçamentos recentes</h2>
      <a href="/quotes.html">Ver todos</a>
    </div>

    <div class="card card-list" id="recent-list">
      ${dash.recent_quotes.length === 0
        ? `<div class="empty"><div class="icon">📋</div><p>Nenhum orçamento ainda.<br>Crie o primeiro!</p>
           <button class="btn btn-primary" onclick="window.location.href='/quote-new.html'">Criar orçamento</button></div>`
        : dash.recent_quotes.map(q => `
          <div class="list-item" onclick="window.location.href='/quotes.html?id=${q.id}'">
            <div class="list-item-avatar">${initials(q.client_name)}</div>
            <div class="list-item-body">
              <div class="list-item-name">${q.client_name}</div>
              <div class="list-item-sub"><span class="badge badge-${q.status}">${statusLabel(q.status)}</span></div>
            </div>
            <div class="list-item-right">
              <div class="list-item-value">${formatMoney(q.total)}</div>
              <div class="list-item-date">${timeAgo(q.created_at)}</div>
            </div>
          </div>`).join('')
      }
    </div>

    ${dash.pending_quotes > 0 ? `
    <div class="card" style="background:#FFF7ED;border:1.5px solid #FED7AA">
      <div class="flex items-center gap-12">
        <div style="font-size:1.6rem">⏳</div>
        <div>
          <div style="font-weight:700;color:#92400E">${dash.pending_quotes} orçamento(s) aguardando resposta</div>
          <div class="text-small" style="color:#B45309">Clientes que ainda não responderam</div>
        </div>
      </div>
      <button class="btn btn-ghost mt-12" onclick="window.location.href='/quotes.html?filter=sent'" style="background:#FED7AA;color:#92400E">Ver pendentes</button>
    </div>` : ''}
  `;
}

load().catch(err => {
  console.error('Dashboard error:', err);
  if (err.message === 'Token inválido') return logout();
  document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px 20px"><p style="color:#4B5563;margin-bottom:16px">Erro: ' + err.message + '</p><button onclick="location.reload()" class="btn btn-primary">Tentar novamente</button></div>';
});
</script>
</body>
</html>
