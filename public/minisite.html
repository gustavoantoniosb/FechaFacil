function fmt(v){return'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

const slug=new URLSearchParams(location.search).get('slug');
async function load(){
  if(!slug){showError();return;}
  try{
    const SUPA='https://rauxfeittdarpsaikynp.supabase.co/rest/v1';
    const h={'apikey':'sb_publishable_NMSSt7zrrdfm7vappE9V5A_RNe4UHbF','Accept':'application/json'};
    const profiles=await fetch(SUPA+'/profiles?slug=eq.'+slug+'&select=*',{headers:h}).then(r=>r.json());
    if(!profiles||!profiles.length){showError();return;}
    const u=profiles[0];
    const services=await fetch(SUPA+'/services?user_id=eq.'+u.id+'&active=eq.true&select=*&order=name.asc',{headers:h}).then(r=>r.json());
    render({user:u,services:services||[]});
  }catch(e){showError();}
}
function showError(){
  document.getElementById('loading').style.display='none';
  document.getElementById('error').style.display='block';
}
function render({user:u,services}){

  const phone=(u.phone||'').replace(/\D/g,'');
  const whatsLink=phone?'https://wa.me/55'+phone+'?text='+encodeURIComponent('Ola '+u.name+'! Vi seu perfil no FechaFacil e gostaria de um orcamento.'):'#';
  const svcs=(services||[]);
  document.getElementById('app').innerHTML='<div class="header"><div class="avatar">'+initials(u.name)+'</div><div class="name">'+u.name+'</div><div class="sub">'+(u.profession||'')+((u.profession&&u.city)?' · ':''+(u.city||''))+'</div></div><div class="body">'+(u.bio?'<div class="card"><div class="card-title">Sobre</div><p class="bio-text">'+u.bio+'</p></div>':'')+(svcs.length?'<div class="card"><div class="card-title">Servicos</div>'+svcs.map(s=>'<div class="svc-item"><span class="svc-name">'+s.name+'</span><span class="svc-price">a partir de '+fmt(s.price)+'</span></div>').join('')+'</div>':'')+(phone?'<div class="card"><div class="card-title">Solicitar orcamento</div><a href="'+whatsLink+'" target="_blank" class="btn btn-whats">Chamar no WhatsApp</a></div>':'')+'</div><div class="footer">Perfil criado com <a href="/" target="_blank">FechaFacil</a></div>';
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
}
load();

}
