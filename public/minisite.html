<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profissional - FechaFacil</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1B3A6B;--blue-light:#2451A0;--orange:#F97316;--orange-dark:#EA6A0A;
  --white:#fff;--bg:#F8FAFC;--border:#E5E7EB;
  --text-1:#1F2937;--text-2:#4B5563;--text-3:#9CA3AF;
  --green:#16A34A;--radius:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text-1);min-height:100vh}

/* Hero */
.hero{background:linear-gradient(145deg,var(--blue) 0%,var(--blue-light) 100%);
  color:#fff;padding:40px 20px 32px;text-align:center}
.avatar{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18);
  border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;
  font-size:2rem;font-weight:800;margin:0 auto 16px;color:#fff;letter-spacing:-1px}
.hero-name{font-size:1.6rem;font-weight:900;margin-bottom:4px}
.hero-prof{font-size:1rem;opacity:.85;margin-bottom:6px}
.hero-city{font-size:.88rem;opacity:.65;margin-bottom:20px}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-wpp{background:#25D366;color:#fff;border:none;border-radius:50px;
  padding:12px 24px;font-size:.95rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:8px;text-decoration:none;transition:all .2s}
.btn-wpp:hover{background:#1EB85C;transform:translateY(-1px)}
.btn-wpp svg{width:20px;height:20px;fill:#fff}
.btn-quote{background:var(--orange);color:#fff;border:none;border-radius:50px;
  padding:12px 24px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;transition:all .2s}
.btn-quote:hover{background:var(--orange-dark)}

/* Content */
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}

/* Bio */
.bio-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin:20px 0;line-height:1.7;color:var(--text-2);font-size:.95rem}

/* Services */
.section-title{font-size:1.1rem;font-weight:800;color:var(--blue);
  margin:28px 0 14px;display:flex;align-items:center;gap:8px}
.services-grid{display:grid;gap:12px}
@media(min-width:480px){.services-grid{grid-template-columns:repeat(2,1fr)}}
.service-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;transition:all .2s;cursor:default}
.service-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:var(--orange)}
.service-icon{font-size:1.8rem;margin-bottom:8px}
.service-name{font-weight:700;color:var(--blue);margin-bottom:4px}
.service-desc{font-size:.83rem;color:var(--text-2);margin-bottom:10px;line-height:1.5}
.service-price{font-size:1rem;font-weight:800;color:var(--orange)}

/* Contact */
.contact-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-top:20px}
.contact-row{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:.93rem;color:var(--text-2);
  text-decoration:none}
.contact-row:last-child{border-bottom:none}
.contact-row:hover{color:var(--blue)}
.contact-icon{font-size:1.3rem;width:32px;text-align:center}

/* Loading */
#loading{display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:60vh;gap:16px}
.spinner{width:36px;height:36px;border:3px solid rgba(27,58,107,.15);
  border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--text-2);font-size:.9rem}

/* Error */
#error-wrap{display:none;text-align:center;padding:80px 20px}
.error-icon{font-size:3.5rem;margin-bottom:16px}
.error-title{font-size:1.2rem;font-weight:800;color:var(--blue);margin-bottom:8px}
.error-sub{color:var(--text-2);font-size:.9rem}

/* Profile content */
#profile-content{display:none}

/* Footer */
footer{text-align:center;padding:24px;font-size:.78rem;color:var(--text-3)}
footer a{color:var(--orange);text-decoration:none;font-weight:600}
footer a:hover{text-decoration:underline}

@media(min-width:768px){
  .hero{padding:56px 40px 44px}
  .avatar{width:110px;height:110px;font-size:2.4rem}
  .hero-name{font-size:2rem}
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Carregando perfil...</p>
</div>

<div id="error-wrap">
  <div class="error-icon">&#128269;</div>
  <div class="error-title">Profissional não encontrado</div>
  <div class="error-sub">O link pode estar incorreto ou o profissional removeu o perfil.</div>
</div>

<div id="profile-content">
  <!-- Hero -->
  <div class="hero">
    <div class="avatar" id="hero-initials"></div>
    <div class="hero-name" id="hero-name"></div>
    <div class="hero-prof" id="hero-prof"></div>
    <div class="hero-city" id="hero-city"></div>
    <div class="hero-btns">
      <a class="btn-wpp" id="btn-wpp" href="#" target="_blank">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </a>
    </div>
  </div>

  <div class="wrap">
    <!-- Bio -->
    <div id="bio-wrap" style="display:none">
      <div class="bio-card" id="hero-bio"></div>
    </div>

    <!-- Serviços -->
    <div id="services-wrap" style="display:none">
      <div class="section-title">&#128295; Serviços</div>
      <div class="services-grid" id="services-list"></div>
    </div>

    <!-- Contato -->
    <div id="contact-wrap" style="display:none">
      <div class="section-title">&#128222; Contato</div>
      <div class="contact-card" id="contact-list"></div>
    </div>
  </div>

  <footer>Orçamento profissional gerado pelo <a href="https://fechafacil.onrender.com" target="_blank">FechaFácil</a></footer>
</div>

<script>
const SUPA = 'https://rauxfeittdarpsaikynp.supabase.co/rest/v1';
const KEY  = 'sb_publishable_NMSSt7zrrdfm7vappE9V5A_RNe4UHbF';
const H    = { apikey: KEY, Accept: 'application/json' };

const slug = new URLSearchParams(location.search).get('slug');

function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'flex' : 'none';
}
function showError() {
  showLoading(false);
  document.getElementById('error-wrap').style.display = 'block';
}
function showProfile() {
  showLoading(false);
  document.getElementById('profile-content').style.display = 'block';
}

function initials(name) {
  if (!name) return '?';
  return name.trim().split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}
function fmtMoney(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function load() {
  if (!slug) { showError(); return; }

  try {
    const profiles = await fetch(
      SUPA + '/profiles?slug=eq.' + encodeURIComponent(slug) + '&select=*',
      { headers: H }
    ).then(r => r.json());

    if (!profiles || !profiles.length) { showError(); return; }
    const u = profiles[0];

    // Update page title
    document.title = (u.name || 'Profissional') + ' - FechaFácil';

    // Hero
    document.getElementById('hero-initials').textContent = initials(u.name);
    document.getElementById('hero-name').textContent = u.name || '';
    document.getElementById('hero-prof').textContent = u.profession || '';
    document.getElementById('hero-city').textContent = u.city ? ('📍 ' + u.city) : '';

    // WhatsApp button
    const phone = (u.phone || '').replace(/\D/g, '');
    if (phone) {
      const wppMsg = 'Olá ' + (u.name||'') + '! Vi seu perfil no FechaFácil e gostaria de solicitar um orçamento.';
      document.getElementById('btn-wpp').href = 'https://wa.me/55' + phone + '?text=' + encodeURIComponent(wppMsg);
    } else {
      document.getElementById('btn-wpp').style.display = 'none';
    }

    // Bio
    if (u.bio) {
      document.getElementById('hero-bio').textContent = u.bio;
      document.getElementById('bio-wrap').style.display = 'block';
    }

    // Services
    const services = await fetch(
      SUPA + '/services?user_id=eq.' + u.id + '&active=eq.true&select=*&order=name.asc',
      { headers: H }
    ).then(r => r.json());

    if (services && services.length) {
      document.getElementById('services-list').innerHTML = services.map(s => {
        const icon = s.icon || '&#128295;';
        const priceHtml = s.price ? '<div class="service-price">' + fmtMoney(s.price) + '</div>' : '';
        const descHtml = s.description ? '<div class="service-desc">' + s.description + '</div>' : '';
        return '<div class="service-card"><div class="service-icon">' + icon + '</div>' +
          '<div class="service-name">' + (s.name||'') + '</div>' +
          descHtml + priceHtml + '</div>';
      }).join('');
      document.getElementById('services-wrap').style.display = 'block';
    }

    // Contact
    const contacts = [];
    if (phone) contacts.push('<a class="contact-row" href="https://wa.me/55' + phone + '" target="_blank"><span class="contact-icon">&#128222;</span>' + u.phone + '</a>');
    if (u.email) contacts.push('<a class="contact-row" href="mailto:' + u.email + '"><span class="contact-icon">&#128140;</span>' + u.email + '</a>');
    if (contacts.length) {
      document.getElementById('contact-list').innerHTML = contacts.join('');
      document.getElementById('contact-wrap').style.display = 'block';
    }

    showProfile();
  } catch(e) {
    showError();
  }
}

load();
</script>
</body>
</html>
