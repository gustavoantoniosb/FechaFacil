<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profissional â FechaFÃ¡cil</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1B3A6B;--orange:#F97316;--green:#16A34A;--gray-1:#1E293B;--gray-2:#64748B;--gray-3:#94A3B8;--border:#E2E8F0;--white:#fff;--bg:#F1F5F9}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--gray-1);min-height:100vh;-webkit-font-smoothing:antialiased}
.header{background:linear-gradient(135deg,var(--blue),#102B52);padding:36px 20px 28px;text-align:center;color:white}
.avatar{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:white;margin:0 auto 14px}
.name{font-size:1.25rem;font-weight:800}
.sub{font-size:.88rem;opacity:.8;margin-top:6px}
.stars{color:#FCD34D;font-size:.9rem;margin-top:6px;letter-spacing:2px}
.body{max-width:480px;margin:0 auto;padding:20px}
.card{background:var(--white);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:20px;margin-bottom:14px}
.card-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-3);margin-bottom:12px}
.svc-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.svc-item:last-child{border-bottom:none}
.svc-name{font-weight:600;font-size:.9rem}
.svc-price{font-weight:800;color:var(--blue);font-size:.9rem}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;margin-bottom:10px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--orange);color:white}
.btn-whats{background:#25D366;color:white}
.bio-text{font-size:.92rem;color:var(--gray-2);line-height:1.65}
.badge{display:inline-block;background:#EFF6FF;color:#1D4ED8;padding:3px 12px;border-radius:50px;font-size:.78rem;font-weight:700}
.footer{text-align:center;padding:24px;font-size:.75rem;color:var(--gray-3)}
.footer a{color:var(--orange);text-decoration:none;font-weight:700}
.quote-form{display:none}
.quote-form input,.quote-form textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;outline:none;margin-bottom:10px}
.quote-form input:focus,.quote-form textarea:focus{border-color:var(--blue)}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading" style="text-align:center;padding:80px 20px">
  <div class="spinner" style="width:32px;height:32px;border-color:rgba(27,58,107,.2);border-top-color:var(--blue);border-width:3px"></div>
</div>
<div id="app" style="display:none"></div>
<div id="error" style="display:none;text-align:center;padding:80px 20px">
  <div style="font-size:3rem;margin-bottom:14px">ð</div>
  <h2>Profissional nÃ£o encontrado</h2>
</div>

<script>
function fmt(v){return'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function initials(n){return(n||'?').trim().split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}

const slug = location.pathname.replace(/^\//, '');

async function load() {
  try {
    const res = await fetch(`/api/minisite/${slug}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    render(data);
  } catch {
    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='block';
  }
}

function render({user: u, services}) {
  document.title = `${u.name} â ${u.profession} | FechaFÃ¡cil`;
  const whatsLink = `https://wa.me/55${u.phone.replace(/\D/g,'')}?text=${encodeURIComponent(`OlÃ¡ ${u.name}! Vi seu perfil no FechaFÃ¡cil e gostaria de solicitar um orÃ§amento.`)}`;
  const activeServices = services.filter(s => s.active);

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="avatar">${initials(u.name)}</div>
      <div class="name">${u.name}</div>
      <div class="sub">${u.profession} Â· ${u.city}</div>
    </div>
    <div class="body">
      ${u.bio ? `<div class="card"><div class="card-title">Sobre</div><p class="bio-text">${u.bio}</p></div>` : ''}

      ${activeServices.length ? `
      <div class="card">
        <div class="card-title">ServiÃ§os</div>
        ${activeServices.map(s => `
          <div class="svc-item">
            <span class="svc-name">${s.name}</span>
            <span class="svc-price">a partir de ${fmt(s.price)}</span>
          </div>`).join('')}
      </div>` : ''}

      <div class="card">
        <div class="card-title">Solicitar orÃ§amento</div>
        <a href="${whatsLink}" target="_blank" class="btn btn-whats">ð¬ Chamar no WhatsApp</a>
        <button class="btn" style="background:var(--bg);color:var(--gray-1);border:1.5px solid var(--border)" onclick="toggleForm()">ð Pedir orÃ§amento por aqui</button>
        <div class="quote-form" id="quote-form">
          <div style="height:12px"></div>
          <input type="text" id="qf-name" placeholder="Seu nome *">
          <input type="tel" id="qf-phone" placeholder="Seu WhatsApp *">
          <textarea id="qf-desc" placeholder="Descreva o serviÃ§o que precisa..." rows="3"></textarea>
          <button class="btn btn-primary" onclick="sendRequest('${u.phone}','${u.name}')">Enviar pedido</button>
        </div>
      </div>
    </div>
    <div class="footer">Perfil criado com <a href="/" target="_blank">FechaFÃ¡cil</a> Â· Sistema de orÃ§amentos para profissionais</div>
  `;
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
}

function toggleForm() {
  const f = document.getElementById('quote-form');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function sendRequest(proPhone, proName) {
  const name = document.getElementById('qf-name').value.trim();
  const phone = document.getElementById('qf-phone').value.trim();
  const desc  = document.getElementById('qf-desc').value.trim();
  if (!name || !phone) { alert('Preencha seu nome e WhatsApp'); return; }
  const msg = `OlÃ¡ ${proName}! Vi seu perfil no FechaFÃ¡cil.\n\n*Nome:* ${name}\n*Telefone:* ${phone}\n*ServiÃ§o:* ${desc || 'NÃ£o informado'}`;
  window.open(`https://wa.me/55${proPhone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
}

load();
</script>
</body>
</html>
