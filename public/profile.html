<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FechaFacil - Perfil</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .svc-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
  .svc-item:last-child{border-bottom:none}.svc-info{flex:1}
  .svc-name{font-weight:600;font-size:.93rem}.svc-price{font-size:.82rem;color:var(--text-2)}
  .svc-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:1.1rem;padding:4px 8px}
  .toggle{width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;transition:background .2s;flex-shrink:0;position:relative}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:white;transition:transform .2s}
  .toggle.on{background:var(--green)}.toggle.on::after{transform:translateX(20px)}.toggle.off{background:var(--border)}
</style>
</head>
<body>
<nav class="top-nav">
  <button class="nav-back" onclick="window.history.back()">â Voltar</button>
  <span class="nav-title">Perfil</span>
  <button class="nav-action" onclick="saveProfile()">Salvar</button>
</nav>
<div class="content"><div id="profile-wrap">
  <div style="text-align:center;padding:40px"><span class="spinner" style="border-color:rgba(27,58,107,.3);border-top-color:var(--blue);width:28px;height:28px;border-width:3px;"></span></div>
</div></div>
<nav class="bottom-nav">
  <a href="/dashboard.html"><span class="icon">&#127968;</span>Inicio</a>
  <a href="/quotes.html"><span class="icon">&#128203;</span>Orcamentos</a>
  <a href="/clients.html"><span class="icon">&#128101;</span>Clientes</a>
  <a href="/profile.html" class="active"><span class="icon">&#128100;</span>Perfil</a>
</nav>
<div class="overlay" id="svc-overlay" onclick="closeSvc(event)">
  <div class="sheet"><div class="sheet-handle"></div>
    <h2>Novo servico</h2>
    <div class="form-group mt-12"><label>Nome do servico *</label><input type="text" id="svc-name" placeholder="Ex: Instalacao de tomadas"></div>
    <div class="form-group"><label>Preco (R$) *</label><input type="number" id="svc-price" placeholder="0.00" min="0" step="0.01"></div>
    <div class="form-group"><label>Descricao</label><input type="text" id="svc-desc" placeholder="Opcional"></div>
    <button class="btn btn-primary" onclick="addService()">Adicionar servico</button>
  </div>
</div>
<div id="toast"></div>
<script src="/js/api.js"></script>
<script>
if(!requireAuth())throw 0;
let user=null,services=[];
async function load(){[user,services]=await Promise.all([API.me(),API.getServices()]);render();}
function render(){
  const u=user;
  const miniUrl=window.location.origin+'/minisite.html?slug='+u.slug;
  document.getElementById('profile-wrap').innerHTML=`
    <div class="text-center mb-16">
      <div class="profile-avatar">${initials(u.name)}</div>
      <h2>${u.name}</h2>
      <p class="text-small">${u.profession||''} Â· ${u.city||''}</p>
      <p class="text-small">${u.email||''}</p>
    </div>
    <div class="card mb-12">
      <h3 style="margin-bottom:14px">Dados do perfil</h3>
      <div class="form-group"><label>Nome completo</label><input type="text" id="p-name" value="${u.name}"></div>
      <div class="form-group"><label>Profissao</label>
        <select id="p-profession">
          ${['Eletricista','Encanador','Tecnico de Ar-condicionado','Pintor','Tecnico de Informatica','Marceneiro','Serralheiro','Pedreiro / Construcao','Jardineiro','Outro']
            .map(opt=>'<option '+(u.profession===opt?'selected':'')+'>'+opt+'</option>').join('')}
        </select></div>
      <div class="form-group"><label>Cidade</label><input type="text" id="p-city" value="${u.city||''}"></div>
      <div class="form-group"><label>WhatsApp</label><input type="tel" id="p-phone" value="${u.phone||''}"></div>
      <div class="form-group"><label>Bio</label><textarea id="p-bio">${u.bio||''}</textarea></div>
        <div class="form-group">
          <label>Seu link público (URL)</label>
          <div style="display:flex;align-items:center;gap:8px;background:var(--gray-5);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:10px 14px">
            <span style="white-space:nowrap;font-size:.82rem;color:var(--text-2)">fechafacil.onrender.com/minisite.html?slug=</span>
            <input type="text" id="p-slug" placeholder="meu-nome-123"
              style="border:none;background:transparent;padding:0;font-size:.88rem;color:var(--text-1);font-weight:600;width:100%;outline:none"
              oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-')">
          </div>
          <div class="form-helper">Apenas letras, números e hifens</div>
        </div>
    </div>
    <div class="card mb-12">
      <div class="flex items-center justify-between mb-12">
        <h3>Meus servicos</h3>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('svc-overlay').classList.add('open')">+ Adicionar</button>
      </div>
      <div id="svc-list">${renderServices()}</div>
    </div>
    <div class="card" style="background:var(--bg)">
      <h3 style="margin-bottom:8px">Meu mini-site</h3>
      <p class="text-small mb-8">Seu perfil publico - compartilhe com clientes!</p>
      <div style="background:var(--white);border-radius:8px;padding:10px 14px;word-break:break-all;font-size:.83rem;color:var(--blue);font-weight:600;cursor:pointer" onclick="copySlug()">
        ${miniUrl}
      </div>
      <div class="flex gap-8 mt-12">
        <a href="/minisite.html?slug=${u.slug}" target="_blank" class="btn btn-outline btn-sm" style="flex:1">Ver mini-site</a>
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="copySlug()">Copiar link</button>
      </div>
    </div>
    <button class="btn btn-danger mt-16" onclick="logout()">Sair da conta</button>
  `;}
function renderServices(){
  if(!services.length)return '<p class="text-small" style="padding:8px 0">Nenhum servico cadastrado.</p>';
  return services.map(s=>'<div class="svc-item"><button class="toggle '+(s.active?'on':'off')+'" onclick="toggleActive('+s.id+','+(s.active?0:1)+')" title="'+(s.active?'Desativar':'Ativar')+'"></button><div class="svc-info"><div class="svc-name">'+s.name+'</div><div class="svc-price">'+formatMoney(s.price)+'</div></div><button class="svc-del" onclick="deleteService('+s.id+')" title="Remover">ðï¸</button></div>').join('');}
async function toggleActive(id,val){const svc=services.find(s=>s.id===id);await API.updateService(id,{...svc,active:val});svc.active=val;document.getElementById('svc-list').innerHTML=renderServices();}
async function deleteService(id){if(!confirm('Remover este servico?'))return;await API.deleteService(id);services=services.filter(s=>s.id!==id);document.getElementById('svc-list').innerHTML=renderServices();toast('Servico removido','success');}
async function addService(){const name=document.getElementById('svc-name').value.trim();const price=parseFloat(document.getElementById('svc-price').value);const desc=document.getElementById('svc-desc').value.trim();if(!name||isNaN(price))return toast('Nome e preco obrigatorios','error');try{const s=await API.createService({name,price,description:desc});services.push(s);document.getElementById('svc-list').innerHTML=renderServices();['svc-name','svc-price','svc-desc'].forEach(id=>document.getElementById(id).value='');closeSvc();toast('Servico adicionado!','success');}catch(e){toast(e.message,'error');}}
async function saveProfile(){try{user=await API.updateMe({name:document.getElementById('p-name').value,profession:document.getElementById('p-profession').value,city:document.getElementById('p-city').value,phone:document.getElementById('p-phone').value,bio:document.getElementById('p-bio').value,
        slug: (document.getElementById('p-slug').value.trim() || undefined)});toast('Perfil salvo!','success');render();}catch(e){toast(e.message,'error');}}
function copySlug(){const link=location.origin+'/minisite.html?slug='+user.slug;navigator.clipboard.writeText(link).then(()=>toast('Link copiado!','success')).catch(()=>{const el=document.createElement('input');el.value=link;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();toast('Link copiado!','success');});}
function closeSvc(e){if(!e||e.target===document.getElementById('svc-overlay'))document.getElementById('svc-overlay').classList.remove('open');}
const _t=setTimeout(()=>{const _e=document.getElementById('profile-wrap');if(_e&&_e.querySelector('.spinner'))_e.innerHTML='<div style="text-align:center;padding:40px"><p style="color:#4B5563;margin-bottom:12px">Tempo esgotado.</p><button onclick="location.reload()" class="btn btn-primary">Tentar novamente</button></div>';},8000);
load().then(()=>clearTimeout(_t)).catch(err=>{clearTimeout(_t);console.error(err);if(err.message==='Token invÃ¡lido')return logout();const _e=document.getElementById('profile-wrap');if(_e)_e.innerHTML='<div style="text-align:center;padding:40px"><p style="color:#4B5563;margin-bottom:12px">Erro: '+err.message+'</p><button onclick="location.reload()" class="btn btn-primary">Tentar novamente</button></div>';});
</script>
</body>
</html>
